# =============================================================================
#  Verify Live Analytics — the "never-again" guardrail
# =============================================================================
#
#  WHY: analytics on www.infinite.fast died silently for ~a month (stale deploy
#  + injector gaps + a PostHog region flip). This workflow checks the LIVE,
#  PUBLIC production pages and synthetic end-to-end routes — independent of how
#  the site is built — and goes RED when the shared runtime or a route breaks.
#
#  TOPOLOGY (split 2026-08-18): two INDEPENDENT jobs, because a local-contract
#  failure must never hide the production-live truth. The previous single-job
#  shape skipped the live-route step whenever a local script failed — a stale
#  doc-wording assertion therefore suppressed every live production check for
#  ~2 weeks (2026-08-03 → 08-17) while main looked "merely" red:
#
#    • local-contracts  — the six repo-local contract scripts, one matrix job
#                         each (fail-fast: false) so every result is visible
#                         at a glance. Also runs on pull_request, so a PR shows
#                         its own contract reds before merge.
#    • production-live  — live public bytes/routes + synthetic receipts. It has
#                         NO `needs:` on local-contracts and runs even when they
#                         are red: a red local contract and a red live route are
#                         separate incidents, never one opaque job. Not run on
#                         pull_request (prod does not serve PR code).
#
#  Triggers:
#    1. push             — right after main changes. production-live waits for
#                          the Vercel production deployment of this exact SHA
#                          (scripts/wait-for-production-deploy.mjs) instead of
#                          a blind fixed sleep.
#    2. schedule         — once a day, to catch silent drift that no deploy
#                          caused (cache expiry, provider changes, a deploy
#                          from elsewhere).
#    3. workflow_dispatch — run it by hand from the Actions tab anytime.
#    4. pull_request     — local-contracts only.
#
#  See docs/ANALYTICS-GUARDRAIL.md for what to do when it fires.
#
#  NOTE: push and schedule triggers only fire when THIS file lives on the
#  repository's default branch (main). On a feature branch, pull_request covers
#  the local contracts and workflow_dispatch covers the rest until merged.
# =============================================================================

name: Verify Live Analytics

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 09:17 UTC. Odd minute to dodge the top-of-hour cron stampede.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per event+ref: PR runs never queue behind main/scheduled runs,
  # while scheduled + post-deploy runs still don't pile up on each other.
  # Let any in-flight run finish; never cancel a live verification midway.
  group: verify-live-analytics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-contracts:
    name: "Local contract: ${{ matrix.contract }}"
    runs-on: ubuntu-latest
    strategy:
      # RUN ALL, REPORT ALL. This check began as a bare `bash -e` chain (the
      # FIRST failing script aborted the step and hid the rest), was repaired
      # into a run-all shell loop, and is now a fail-fast:false matrix: every
      # contract runs in its own job, so one stale assertion can never again
      # suppress or obscure any other contract's result.
      fail-fast: false
      matrix:
        contract:
          - test-inject-analytics.mjs
          - test-get-started-page.mjs
          - test-routing-middleware.mjs
          - test-static-remediation.mjs
          - test-public-site-graph.mjs
          - test-agent-install-surface.mjs
          - test-feature-pillars.mjs
          - test-prepare-static-deploy.mjs
          - test-launch-video-pages.mjs
          - test-csp-report.mjs
          - test-verify-live-analytics.mjs
    steps:
      - name: Checkout (for the contract script under test)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install reviewed analytics dependencies
        run: npm ci

      - name: Run ${{ matrix.contract }}
        run: node ".github/scripts/${{ matrix.contract }}"

      - name: Require a clean reviewed checkout after local verification
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  production-live:
    name: Verify live production analytics
    runs-on: ubuntu-latest
    # Deliberately NOT on pull_request — this job reads the LIVE production
    # site, which does not serve PR code. And deliberately NO
    # `needs: local-contracts` — the live production truth must be reported
    # even when a local contract is red (that exact dependency skip is how the
    # dead alarm stayed invisible; see the header).
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout (for the verifier script + page list)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install reviewed analytics dependencies
        run: npm ci

      # Vercel builds independently on every push to main. Instead of a blind
      # fixed sleep, poll for the production deployment whose git SHA equals
      # this run's commit and require it READY (bounded retries + timeout, and
      # a hard fail when that deploy terminally failed — live bytes would be
      # stale). Without a VERCEL_TOKEN secret the script warns loudly and
      # falls back to the bounded legacy settle wait. Skipped for schedule/
      # manual runs, where the site is already settled.
      - name: Wait for the production deploy of this commit (push only)
        if: ${{ github.event_name == 'push' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/wait-for-production-deploy.mjs

      # TODO(pass-2 after source ownership repair): the synthetic-receipt
      # configuration below (SYNTHETIC_SITE_SOURCE_KEY, ANALYTICS_RECEIPT_*,
      # SYNTHETIC_DRAIN_*) still targets the Local-workspace sources. That
      # re-point is DELIBERATELY deferred to guardrail pass 2, after the site
      # source ownership repair moves collection to the Infinite Site
      # workspace. Do not re-point it before that repair lands.
      - name: Verify live analytics bytes and routes
        env:
          # Expected values come from repo variables (Settings -> Secrets and
          # variables -> Actions -> Variables). The script has safe public
          # defaults, so unset variables still yield a meaningful check.
          EXPECTED_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          EXPECTED_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}
          EXPECTED_GA_TAG_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_TAG_ID }}
          EXPECTED_INFINITE_SITE_SOURCE_KEY: ${{ vars.EXPECTED_INFINITE_SITE_SOURCE_KEY }}
          # Browser-led desktop handoff (Wave 2): flip the repo variable TOGETHER with the Vercel
          # INFINITE_HANDOFF_ENABLED build flag — the verifier enforces presence when 1, absence otherwise.
          EXPECTED_HANDOFF_ENABLED: ${{ vars.EXPECTED_HANDOFF_ENABLED }}
          REQUIRE_SYNTHETIC_RECEIPTS: ${{ vars.REQUIRE_SYNTHETIC_RECEIPTS }}
          SYNTHETIC_SITE_SOURCE_KEY: ${{ secrets.SYNTHETIC_SITE_SOURCE_KEY }}
          ANALYTICS_RECEIPT_URL: ${{ vars.ANALYTICS_RECEIPT_URL }}
          ANALYTICS_RECEIPT_TOKEN: ${{ secrets.ANALYTICS_RECEIPT_TOKEN }}
          SYNTHETIC_DRAIN_URL: ${{ vars.SYNTHETIC_DRAIN_URL }}
          SYNTHETIC_DRAIN_SECRET: ${{ secrets.SYNTHETIC_DRAIN_SECRET }}
          SYNTHETIC_VERCEL_PROJECT_ID: ${{ vars.SYNTHETIC_VERCEL_PROJECT_ID }}
          SYNTHETIC_PRODUCTION_HOST: infinite.fast
        run: node scripts/verify-live-analytics.mjs
