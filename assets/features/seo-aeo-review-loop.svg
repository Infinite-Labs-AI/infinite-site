<svg width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-seo-aeo-review-loop desc-seo-aeo-review-loop" xmlns="http://www.w3.org/2000/svg">
  <title id="title-seo-aeo-review-loop">Interface diagram of an SEO and AEO draft moving through review, publishing, and measurement</title>
  <desc id="desc-seo-aeo-review-loop">A synthetic vector interface diagram showing a question becoming an SEO and AEO draft, then passing through review, publishing, and measurement. It uses placeholder metrics and is not a screenshot.</desc>
  <defs>
    <linearGradient id="bg-seo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f4ec"/>
    </linearGradient>
    <filter id="soft-seo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-seo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg-seo)"/>
  <rect x="72" y="58" width="1296" height="784" rx="42" fill="#ffffff" stroke="#e6edf3"/>
  <text x="112" y="116" fill="#64717d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">Interface diagram</text>
  <text x="112" y="164" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800">SEO + AEO review loop</text>
  <text x="112" y="204" fill="#52606b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Question to reviewed draft to published evidence and measurement.</text>
  <g transform="translate(1110 102)">
    <rect width="210" height="72" rx="24" fill="#f8fafc" stroke="#dce6ef"/>
    <text x="24" y="31" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Synthetic labels only</text>
    <text x="24" y="53" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Not a screenshot</text>
  </g>

  <g data-card="question" transform="translate(116 310)" filter="url(#soft-seo)">
    <rect data-card-box="true" width="278" height="316" rx="30" fill="#f8fafc" stroke="#dbe4ec"/>
    <circle cx="50" cy="54" r="23" fill="#dbeafe"/>
    <text x="42" y="62" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">1</text>
    <text x="30" y="112" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="800">Question</text>
    <text x="30" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">
      <tspan x="30" dy="0">What should a founder</tspan>
      <tspan x="30" dy="26">publish to earn AI</tspan>
      <tspan x="30" dy="26">answer citations?</tspan>
    </text>
    <rect x="30" y="244" width="218" height="44" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="50" y="272" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">14 sample questions</text>
  </g>

  <path d="M 412 468 L 476 468" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-seo)"/>

  <g data-card="review" transform="translate(496 282)" filter="url(#soft-seo)">
    <rect data-card-box="true" width="286" height="372" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <circle cx="50" cy="54" r="23" fill="#111827"/>
    <text x="42" y="62" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">2</text>
    <text x="30" y="112" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="800">Review</text>
    <text x="30" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">
      <tspan x="30" dy="0">Human checks claims,</tspan>
      <tspan x="30" dy="26">sources, and practical</tspan>
      <tspan x="30" dy="26">next actions.</tspan>
    </text>
    <rect x="30" y="252" width="226" height="38" rx="14" fill="#eff6ff"/>
    <text x="48" y="277" fill="#1e3a8a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Evidence attached</text>
    <rect x="30" y="306" width="226" height="38" rx="14" fill="#dcfce7"/>
    <text x="48" y="331" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Approved draft</text>
  </g>

  <path d="M 800 468 L 864 468" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-seo)"/>

  <g data-card="publish" transform="translate(884 310)" filter="url(#soft-seo)">
    <rect data-card-box="true" width="206" height="316" rx="30" fill="#0f172a"/>
    <circle cx="50" cy="54" r="23" fill="#dbeafe"/>
    <text x="42" y="62" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">3</text>
    <text x="30" y="112" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="800">Publish</text>
    <text x="30" y="154" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">
      <tspan x="30" dy="0">Send the reviewed</tspan>
      <tspan x="30" dy="26">page live after</tspan>
      <tspan x="30" dy="26">approval.</tspan>
    </text>
    <rect x="30" y="244" width="116" height="44" rx="16" fill="#ffffff"/>
    <text x="52" y="272" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">Ready</text>
  </g>

  <path d="M 1108 468 L 1172 468" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-seo)"/>

  <g data-card="measurement" transform="translate(1192 282)" filter="url(#soft-seo)">
    <rect data-card-box="true" width="204" height="372" rx="30" fill="#f8fafc" stroke="#dbe4ec"/>
    <circle cx="48" cy="54" r="23" fill="#dbeafe"/>
    <text x="40" y="62" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">4</text>
    <text x="24" y="112" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">Measurement</text>
    <text x="24" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">
      <tspan x="24" dy="0">Track citations,</tspan>
      <tspan x="24" dy="24">visits, and next</tspan>
      <tspan x="24" dy="24">questions.</tspan>
    </text>
    <rect x="24" y="274" width="104" height="46" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="46" y="303" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">+18%</text>
  </g>
</svg>
