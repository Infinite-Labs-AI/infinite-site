<svg width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-seo-aeo-review-loop desc-seo-aeo-review-loop" xmlns="http://www.w3.org/2000/svg">
  <title id="title-seo-aeo-review-loop">Interface diagram of an SEO and AEO draft moving through review, publishing, and measurement</title>
  <desc id="desc-seo-aeo-review-loop">A synthetic vector interface diagram showing a question becoming an SEO and AEO draft, then passing through review, publishing, and measurement. It uses placeholder metrics and is not a screenshot.</desc>
  <defs>
    <linearGradient id="bg-seo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f4ec"/>
    </linearGradient>
    <filter id="soft-seo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-seo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg-seo)"/>
  <rect x="70" y="56" width="1300" height="788" rx="42" fill="#ffffff" stroke="#e6edf3"/>
  <text x="112" y="116" fill="#64717d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">Interface diagram</text>
  <text x="112" y="164" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800">SEO + AEO review loop</text>
  <text x="112" y="204" fill="#52606b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Question to reviewed draft to published evidence and measurement.</text>
  <g transform="translate(1110 102)">
    <rect width="210" height="72" rx="24" fill="#f8fafc" stroke="#dce6ef"/>
    <text x="24" y="31" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Synthetic labels only</text>
    <text x="24" y="53" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Not a screenshot</text>
  </g>

  <g transform="translate(118 294)" filter="url(#soft-seo)">
    <rect width="272" height="360" rx="30" fill="#f8fafc" stroke="#dbe4ec"/>
    <circle cx="54" cy="58" r="24" fill="#dbeafe"/>
    <text x="46" y="66" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">1</text>
    <text x="32" y="116" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">Question</text>
    <text x="32" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">What should a founder publish to be cited by answer engines?</text>
    <rect x="32" y="224" width="208" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="52" y="250" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800">Synthetic demand</text>
    <text x="52" y="274" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="900">14 questions</text>
  </g>

  <path d="M 410 474 L 500 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-seo)"/>

  <g transform="translate(520 266)" filter="url(#soft-seo)">
    <rect width="280" height="416" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <circle cx="54" cy="58" r="24" fill="#111827"/>
    <text x="46" y="66" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">2</text>
    <text x="32" y="116" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">Review</text>
    <text x="32" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Human checks claims, sources, and actionability before release.</text>
    <g transform="translate(32 228)">
      <rect width="216" height="44" rx="16" fill="#eff6ff"/>
      <text x="18" y="29" fill="#1e3a8a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Evidence attached</text>
    </g>
    <g transform="translate(32 292)">
      <rect width="216" height="44" rx="16" fill="#fef3c7"/>
      <text x="18" y="29" fill="#92400e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Edits required: 3</text>
    </g>
    <g transform="translate(32 356)">
      <rect width="216" height="44" rx="16" fill="#dcfce7"/>
      <text x="18" y="29" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Approved draft</text>
    </g>
  </g>

  <path d="M 820 474 L 910 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-seo)"/>

  <g transform="translate(930 294)" filter="url(#soft-seo)">
    <rect width="180" height="360" rx="30" fill="#0f172a"/>
    <circle cx="54" cy="58" r="24" fill="#dbeafe"/>
    <text x="46" y="66" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">3</text>
    <text x="32" y="116" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">Publish</text>
    <text x="32" y="154" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Send the reviewed page live.</text>
    <rect x="32" y="252" width="116" height="54" rx="18" fill="#ffffff"/>
    <text x="54" y="285" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">Ready</text>
  </g>

  <path d="M 1130 474 L 1214 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-seo)"/>

  <g transform="translate(1230 294)" filter="url(#soft-seo)">
    <rect width="150" height="360" rx="30" fill="#f8fafc" stroke="#dbe4ec"/>
    <circle cx="52" cy="58" r="24" fill="#dbeafe"/>
    <text x="44" y="66" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">4</text>
    <text x="28" y="116" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Measurement</text>
    <text x="28" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Track citations, visits, and next questions.</text>
    <rect x="28" y="254" width="94" height="52" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="50" y="286" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">+18%</text>
  </g>
</svg>
