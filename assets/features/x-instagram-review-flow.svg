<svg width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-x-instagram-review-flow desc-x-instagram-review-flow" xmlns="http://www.w3.org/2000/svg">
  <title id="title-x-instagram-review-flow">Interface diagram of attributed X and Instagram inspiration moving through draft and human review</title>
  <desc id="desc-x-instagram-review-flow">A synthetic vector interface diagram showing attributed social inspiration moving into draft and script ideas, then waiting for human review. It contains no handles, emails, external links, or real screenshots.</desc>
  <defs>
    <linearGradient id="bg-social" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="social-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft-social" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-social" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg-social)"/>
  <text x="92" y="82" fill="#64717d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">Interface diagram</text>
  <text x="92" y="132" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800">X + Instagram content generation</text>
  <text x="92" y="172" fill="#52606b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Attributed inspiration becomes draft/script ideas and stops for human review.</text>
  <g transform="translate(1114 78)">
    <rect width="218" height="72" rx="24" fill="#ffffff" stroke="#dce6ef"/>
    <text x="24" y="31" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Synthetic labels only</text>
    <text x="24" y="53" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Not a screenshot</text>
  </g>

  <g data-card="attributed-source" transform="translate(92 258)" filter="url(#soft-social)">
    <rect data-card-box="true" width="366" height="450" rx="36" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="30" y="30" width="306" height="66" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="54" y="72" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800">Attributed source</text>
    <g transform="translate(32 132)">
      <rect width="302" height="90" rx="22" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="24" y="32" fill="#5b21b6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">X inspiration</text>
      <text x="24" y="62" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Source card A</text>
      <text x="24" y="82" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Hook pattern retained</text>
    </g>
    <g transform="translate(32 246)">
      <rect width="302" height="90" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="24" y="32" fill="#1e40af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">Instagram inspiration</text>
      <text x="24" y="62" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Source card B</text>
      <text x="24" y="82" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Attribution retained</text>
    </g>
    <text x="36" y="390" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">
      <tspan x="36" dy="0">No handles or private</tspan>
      <tspan x="36" dy="22">audience data.</tspan>
    </text>
  </g>

  <path d="M 486 484 C 540 484, 568 484, 622 484" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-social)"/>

  <g data-card="draft-script" transform="translate(646 238)" filter="url(#soft-social)">
    <rect data-card-box="true" width="356" height="490" rx="36" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="30" y="30" width="296" height="66" rx="22" fill="url(#social-accent)"/>
    <text x="54" y="72" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800">Draft/script</text>
    <g transform="translate(34 130)">
      <rect width="288" height="74" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="22" y="31" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">Post draft</text>
      <text x="22" y="56" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">Founder lesson angle</text>
    </g>
    <g transform="translate(34 224)">
      <rect width="288" height="74" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="22" y="31" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">Carousel draft</text>
      <text x="22" y="56" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">5 synthetic slides</text>
    </g>
    <g transform="translate(34 318)">
      <rect width="288" height="74" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="22" y="31" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">Video script</text>
      <text x="22" y="56" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">32 second outline</text>
    </g>
    <text x="38" y="438" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">
      <tspan x="38" dy="0">Drafts are generated,</tspan>
      <tspan x="38" dy="22">not auto-posted.</tspan>
    </text>
  </g>

  <path d="M 1030 484 C 1082 484, 1110 484, 1162 484" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-social)"/>

  <g data-card="human-review" transform="translate(1186 258)" filter="url(#soft-social)">
    <rect data-card-box="true" width="206" height="450" rx="36" fill="#111827"/>
    <circle cx="54" cy="64" r="24" fill="#ffffff"/>
    <path d="M42 65 l8 8 l18 -22" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="126" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Human review</text>
    <text x="24" y="168" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">
      <tspan x="24" dy="0">Approve, edit,</tspan>
      <tspan x="24" dy="24">or reject before</tspan>
      <tspan x="24" dy="24">publishing.</tspan>
    </text>
    <rect x="24" y="302" width="104" height="54" rx="18" fill="#ffffff"/>
    <text x="49" y="335" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">Hold</text>
  </g>
</svg>
