<svg width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-x-instagram-review-flow desc-x-instagram-review-flow" xmlns="http://www.w3.org/2000/svg">
  <title id="title-x-instagram-review-flow">Interface diagram of attributed X and Instagram inspiration moving through draft and human review</title>
  <desc id="desc-x-instagram-review-flow">A synthetic vector interface diagram showing attributed social inspiration moving into draft and script ideas, then waiting for human review. It contains no handles, emails, external links, or real screenshots.</desc>
  <defs>
    <linearGradient id="bg-social" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="social-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft-social" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-social" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg-social)"/>
  <text x="92" y="82" fill="#64717d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">Interface diagram</text>
  <text x="92" y="132" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800">X + Instagram content generation</text>
  <text x="92" y="172" fill="#52606b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Attributed inspiration becomes draft/script ideas and stops for human review.</text>
  <g transform="translate(1114 78)">
    <rect width="218" height="72" rx="24" fill="#ffffff" stroke="#dce6ef"/>
    <text x="24" y="31" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Synthetic labels only</text>
    <text x="24" y="53" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Not a screenshot</text>
  </g>

  <g transform="translate(92 250)" filter="url(#soft-social)">
    <rect width="362" height="470" rx="36" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="30" y="30" width="302" height="70" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="54" y="74" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Attributed source</text>
    <g transform="translate(32 138)">
      <rect width="298" height="96" rx="24" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="24" y="34" fill="#5b21b6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">X inspiration</text>
      <text x="24" y="64" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Source card A</text>
      <text x="24" y="84" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Hook pattern · citation retained</text>
    </g>
    <g transform="translate(32 258)">
      <rect width="298" height="96" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="24" y="34" fill="#1e40af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">Instagram inspiration</text>
      <text x="24" y="64" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Source card B</text>
      <text x="24" y="84" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Visual angle · attribution retained</text>
    </g>
    <text x="36" y="416" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">No handles or private audience data.</text>
  </g>

  <path d="M 482 484 C 540 484, 568 484, 626 484" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-social)"/>

  <g transform="translate(650 230)" filter="url(#soft-social)">
    <rect width="340" height="510" rx="36" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="30" y="30" width="280" height="70" rx="24" fill="url(#social-accent)"/>
    <text x="54" y="74" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Draft/script</text>
    <g transform="translate(34 136)">
      <rect width="272" height="78" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="22" y="32" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">Post draft</text>
      <text x="22" y="57" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">Founder lesson angle</text>
    </g>
    <g transform="translate(34 236)">
      <rect width="272" height="78" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="22" y="32" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">Carousel draft</text>
      <text x="22" y="57" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">5 synthetic slides</text>
    </g>
    <g transform="translate(34 336)">
      <rect width="272" height="78" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="22" y="32" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">Video script</text>
      <text x="22" y="57" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">32 second outline</text>
    </g>
    <text x="38" y="462" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Drafts are generated, not auto-posted.</text>
  </g>

  <path d="M 1018 484 C 1076 484, 1104 484, 1162 484" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-social)"/>

  <g transform="translate(1186 250)" filter="url(#soft-social)">
    <rect width="162" height="470" rx="36" fill="#111827"/>
    <circle cx="54" cy="68" r="26" fill="#ffffff"/>
    <path d="M42 69 l8 8 l18 -22" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="134" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Human review</text>
    <text x="30" y="178" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Approve, edit, or reject before publishing.</text>
    <rect x="30" y="294" width="102" height="58" rx="18" fill="#ffffff"/>
    <text x="51" y="329" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">Hold</text>
  </g>
</svg>
