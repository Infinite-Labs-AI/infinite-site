<svg width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-ads-approval-boundary desc-ads-approval-boundary" xmlns="http://www.w3.org/2000/svg">
  <title id="title-ads-approval-boundary">Interface diagram of an ad proposal moving through confirmation, policy guards, and action history</title>
  <desc id="desc-ads-approval-boundary">A synthetic vector interface diagram showing an ads workflow where a measured signal creates a paused proposal, then waits for confirmation, policy guard checks, and action history logging. It contains placeholder numbers only.</desc>
  <defs>
    <linearGradient id="bg-ads" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <filter id="soft-ads" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-ads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg-ads)"/>
  <text x="92" y="82" fill="#64717d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">Interface diagram</text>
  <text x="92" y="132" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800">Ads approval boundary</text>
  <text x="92" y="172" fill="#52606b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Measured signal creates a paused proposal. Human confirmation gates action.</text>
  <g transform="translate(1114 78)">
    <rect width="218" height="72" rx="24" fill="#ffffff" stroke="#dce6ef"/>
    <text x="24" y="31" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Synthetic labels only</text>
    <text x="24" y="53" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Not a screenshot</text>
  </g>

  <g transform="translate(80 310)" filter="url(#soft-ads)">
    <rect width="230" height="310" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="28" y="28" width="174" height="54" rx="18" fill="#eff6ff"/>
    <text x="44" y="62" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">01</text>
    <text x="28" y="124" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800">Measured signal</text>
    <text x="28" y="162" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Synthetic funnel data detects a creative gap.</text>
    <rect x="28" y="224" width="174" height="46" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="48" y="253" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">CPA +24%</text>
  </g>

  <path d="M 330 464 L 406 464" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g transform="translate(426 286)" filter="url(#soft-ads)">
    <rect width="230" height="358" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="28" y="28" width="174" height="54" rx="18" fill="#fef3c7"/>
    <text x="44" y="62" fill="#92400e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">02</text>
    <text x="28" y="124" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800">Paused proposal</text>
    <text x="28" y="162" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Draft budget and copy stay paused by default.</text>
    <rect x="28" y="242" width="174" height="70" rx="18" fill="#111827"/>
    <text x="50" y="270" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">State</text>
    <text x="50" y="296" fill="#fef3c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">Paused</text>
  </g>

  <path d="M 676 464 L 752 464" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g transform="translate(772 310)" filter="url(#soft-ads)">
    <rect width="210" height="310" rx="30" fill="#111827"/>
    <rect x="28" y="28" width="154" height="54" rx="18" fill="#ffffff"/>
    <text x="44" y="62" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">03</text>
    <text x="28" y="124" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800">Confirmation</text>
    <text x="28" y="162" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Human approval is required before launch.</text>
    <rect x="28" y="226" width="154" height="50" rx="16" fill="#ffffff"/>
    <text x="49" y="257" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="900">Approve action</text>
  </g>

  <path d="M 1002 464 L 1078 464" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g transform="translate(1098 286)" filter="url(#soft-ads)">
    <rect width="164" height="358" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="24" y="28" width="116" height="54" rx="18" fill="#dcfce7"/>
    <text x="40" y="62" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">04</text>
    <text x="24" y="124" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800">Policy guard</text>
    <text x="24" y="164" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Checks destination, copy, and spend limits.</text>
    <rect x="24" y="260" width="116" height="44" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="288" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">Passed</text>
  </g>

  <path d="M 1278 464 L 1328 464" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g transform="translate(1340 310)" filter="url(#soft-ads)">
    <rect width="74" height="310" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <text x="24" y="62" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">05</text>
    <text x="24" y="124" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800" transform="rotate(90 24 124)">History</text>
  </g>
</svg>
