<svg width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-ads-approval-boundary desc-ads-approval-boundary" xmlns="http://www.w3.org/2000/svg">
  <title id="title-ads-approval-boundary">Interface diagram of an ad proposal moving through confirmation, policy guards, and action history</title>
  <desc id="desc-ads-approval-boundary">A synthetic vector interface diagram showing an ads workflow where a measured signal creates a paused proposal, then waits for confirmation, policy guard checks, and action history logging. It contains placeholder numbers only.</desc>
  <defs>
    <linearGradient id="bg-ads" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <filter id="soft-ads" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-ads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg-ads)"/>
  <text x="92" y="82" fill="#64717d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">Interface diagram</text>
  <text x="92" y="132" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800">Ads approval boundary</text>
  <text x="92" y="172" fill="#52606b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Measured signal creates a paused proposal. Human confirmation gates action.</text>
  <g transform="translate(1114 78)">
    <rect width="218" height="72" rx="24" fill="#ffffff" stroke="#dce6ef"/>
    <text x="24" y="31" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Synthetic labels only</text>
    <text x="24" y="53" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Not a screenshot</text>
  </g>

  <g data-card="measured-signal" transform="translate(80 314)" filter="url(#soft-ads)">
    <rect data-card-box="true" width="224" height="318" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="26" y="28" width="172" height="50" rx="17" fill="#eff6ff"/>
    <text x="42" y="60" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">01</text>
    <text x="26" y="120" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Measured signal</text>
    <text x="26" y="158" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">
      <tspan x="26" dy="0">Synthetic funnel</tspan>
      <tspan x="26" dy="24">data detects a</tspan>
      <tspan x="26" dy="24">creative gap.</tspan>
    </text>
    <rect x="26" y="250" width="150" height="42" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="46" y="277" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">CPA +24%</text>
  </g>

  <path d="M 324 474 L 378 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g data-card="paused-proposal" transform="translate(398 288)" filter="url(#soft-ads)">
    <rect data-card-box="true" width="236" height="370" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="26" y="28" width="184" height="50" rx="17" fill="#fef3c7"/>
    <text x="42" y="60" fill="#92400e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">02</text>
    <text x="26" y="120" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Paused proposal</text>
    <text x="26" y="158" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">
      <tspan x="26" dy="0">Draft budget and</tspan>
      <tspan x="26" dy="24">copy stay paused</tspan>
      <tspan x="26" dy="24">by default.</tspan>
    </text>
    <rect x="26" y="276" width="150" height="54" rx="18" fill="#111827"/>
    <text x="48" y="299" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900">State</text>
    <text x="48" y="322" fill="#fef3c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="900">Paused</text>
  </g>

  <path d="M 654 474 L 708 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g data-card="confirmation" transform="translate(728 314)" filter="url(#soft-ads)">
    <rect data-card-box="true" width="226" height="318" rx="30" fill="#111827"/>
    <rect x="26" y="28" width="174" height="50" rx="17" fill="#ffffff"/>
    <text x="42" y="60" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">03</text>
    <text x="26" y="120" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Confirmation</text>
    <text x="26" y="158" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">
      <tspan x="26" dy="0">Human approval</tspan>
      <tspan x="26" dy="24">is required before</tspan>
      <tspan x="26" dy="24">launch.</tspan>
    </text>
    <rect x="26" y="250" width="152" height="42" rx="15" fill="#ffffff"/>
    <text x="46" y="277" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="900">Approve</text>
  </g>

  <path d="M 974 474 L 1028 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g data-card="policy-guard" transform="translate(1048 288)" filter="url(#soft-ads)">
    <rect data-card-box="true" width="214" height="370" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <rect x="24" y="28" width="166" height="50" rx="17" fill="#dcfce7"/>
    <text x="40" y="60" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">04</text>
    <text x="24" y="120" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Policy guard</text>
    <text x="24" y="158" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">
      <tspan x="24" dy="0">Checks destination,</tspan>
      <tspan x="24" dy="24">copy, and spend</tspan>
      <tspan x="24" dy="24">limits.</tspan>
    </text>
    <rect x="24" y="276" width="116" height="42" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="303" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="900">Passed</text>
  </g>

  <path d="M 1282 474 L 1316 474" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-ads)"/>

  <g data-card="history" transform="translate(1330 314)" filter="url(#soft-ads)">
    <rect data-card-box="true" width="104" height="318" rx="30" fill="#ffffff" stroke="#dbe4ec"/>
    <text x="24" y="60" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">05</text>
    <text x="18" y="120" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">History</text>
    <text x="18" y="160" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
      <tspan x="18" dy="0">Action</tspan>
      <tspan x="18" dy="21">log</tspan>
    </text>
  </g>
</svg>
